<svg xmlns="http://www.w3.org/2000/svg" width="960" height="330" viewBox="0 0 960 330" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="960" height="330" rx="10" fill="#ffffff"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8c959f"/></marker></defs>
<text x="40" y="46" font-size="20" fill="#1b1f24" text-anchor="start" font-weight="600" >One conversation, two sources of context</text>
<text x="40" y="70" font-size="14" fill="#57606a" text-anchor="start" font-weight="normal" >Sai separates what the person actually said from what the agent filled in on its own.</text>
<rect x="40" y="95" width="280" height="200" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
<text x="60" y="125" font-size="15" fill="#1b1f24" text-anchor="start" font-weight="600" >What the person said</text>
<rect x="60" y="150" width="240" height="26" rx="13" fill="#ddebff" stroke="#ddebff"/>
<text x="74" y="167" font-size="12" fill="#1b1f24" text-anchor="start" font-weight="normal" >I got an offer in another city</text>
<rect x="60" y="186" width="240" height="26" rx="13" fill="#ddebff" stroke="#ddebff"/>
<text x="74" y="203" font-size="12" fill="#1b1f24" text-anchor="start" font-weight="normal" >My partner is open to moving later</text>
<rect x="60" y="222" width="240" height="26" rx="13" fill="#ddebff" stroke="#ddebff"/>
<text x="74" y="239" font-size="12" fill="#1b1f24" text-anchor="start" font-weight="normal" >Weekend visits matter most to me</text>
<rect x="60" y="258" width="240" height="26" rx="13" fill="#ddebff" stroke="#ddebff"/>
<text x="74" y="275" font-size="12" fill="#1b1f24" text-anchor="start" font-weight="normal" >Money is not the deciding factor</text>
<rect x="640" y="95" width="280" height="200" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
<text x="660" y="125" font-size="15" fill="#1b1f24" text-anchor="start" font-weight="600" >What the agent built on</text>
<rect x="660" y="150" width="240" height="26" rx="13" fill="#ddebff" stroke="#ddebff"/>
<text x="674" y="167" font-size="12" fill="#1b1f24" text-anchor="start" font-weight="normal" >an offer in another city</text>
<rect x="660" y="186" width="240" height="26" rx="13" fill="#fbe3dc" stroke="#fbe3dc"/>
<text x="674" y="203" font-size="12" fill="#1b1f24" text-anchor="start" font-weight="normal" >career growth is the main goal</text>
<rect x="660" y="222" width="240" height="26" rx="13" fill="#fbe3dc" stroke="#fbe3dc"/>
<text x="674" y="239" font-size="12" fill="#1b1f24" text-anchor="start" font-weight="normal" >the partner will resist moving</text>
<rect x="660" y="258" width="240" height="26" rx="13" fill="#f8ecd2" stroke="#f8ecd2"/>
<text x="674" y="275" font-size="12" fill="#1b1f24" text-anchor="start" font-weight="normal" >(weekend visits never used)</text>
<rect x="360" y="130" width="240" height="130" rx="8" fill="#ffffff" stroke="#8c959f" stroke-dasharray="5 4"/>
<text x="480" y="165" font-size="14" fill="#57606a" text-anchor="middle" font-weight="normal" >Sai measures</text>
<text x="480" y="190" font-size="17" fill="#1b1f24" text-anchor="middle" font-weight="600" >the gap in between</text>
<text x="480" y="222" font-size="12" fill="#57606a" text-anchor="middle" font-weight="normal" >used · missed · contradicted</text>
<text x="480" y="242" font-size="12" fill="#57606a" text-anchor="middle" font-weight="normal" >grounded · assumed</text>
<line x1="322" y1="195" x2="356" y2="195" stroke="#8c959f" stroke-width="2" marker-end="url(#ah)"/>
<line x1="638" y1="195" x2="604" y2="195" stroke="#8c959f" stroke-width="2" marker-end="url(#ah)"/>
<rect x="40" y="309" width="14" height="10" rx="3" fill="#ddebff"/>
<text x="60" y="318" font-size="12" fill="#57606a" text-anchor="start" font-weight="normal" >grounded in what the person said</text>
<rect x="295.2" y="309" width="14" height="10" rx="3" fill="#fbe3dc"/>
<text x="315.2" y="318" font-size="12" fill="#57606a" text-anchor="start" font-weight="normal" >assumed or contradicted</text>
<rect x="491.0" y="309" width="14" height="10" rx="3" fill="#f8ecd2"/>
<text x="511.0" y="318" font-size="12" fill="#57606a" text-anchor="start" font-weight="normal" >missed</text>
</svg>
