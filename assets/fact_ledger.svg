<text x="40" y="44" font-size="20" fill="#1b1f24" text-anchor="start" font-weight="600" >The fact ledger</text>
<text x="40" y="68" font-size="14" fill="#57606a" text-anchor="start" font-weight="normal" >Written before any agent runs. Every response is checked against it, turn by turn.</text>
