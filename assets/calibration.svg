<svg xmlns="http://www.w3.org/2000/svg" width="960" height="250" viewBox="0 0 960 250" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="960" height="250" rx="10" fill="#ffffff"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8c959f"/></marker></defs>
<text x="40" y="44" font-size="20" fill="#1b1f24" text-anchor="start" font-weight="600" >People first, judges second</text>
<text x="40" y="68" font-size="14" fill="#57606a" text-anchor="start" font-weight="normal" >A judge scales the measurement only after it agrees with human coders.</text>
<rect x="40" y="100" width="160" height="100" rx="8" fill="#ddebff" stroke="#ddebff"/>
<text x="54" y="130" font-size="14" fill="#1b1f24" text-anchor="start" font-weight="600" >People code</text>
<text x="54" y="156" font-size="12" fill="#57606a" text-anchor="start" font-weight="normal" >a first set of</text>
<text x="54" y="174" font-size="12" fill="#57606a" text-anchor="start" font-weight="normal" >responses</text>
<line x1="203" y1="150" x2="223" y2="150" stroke="#8c959f" stroke-width="2" marker-end="url(#ah)"/>
<rect x="226" y="100" width="160" height="100" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
<text x="240" y="130" font-size="14" fill="#1b1f24" text-anchor="start" font-weight="600" >Two LLM judges</text>
<text x="240" y="156" font-size="12" fill="#57606a" text-anchor="start" font-weight="normal" >score the same set,</text>
<text x="240" y="174" font-size="12" fill="#57606a" text-anchor="start" font-weight="normal" >blind to each other</text>
<line x1="389" y1="150" x2="409" y2="150" stroke="#8c959f" stroke-width="2" marker-end="url(#ah)"/>
<rect x="412" y="100" width="160" height="100" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
<text x="426" y="130" font-size="14" fill="#1b1f24" text-anchor="start" font-weight="600" >Consensus rule</text>
<text x="426" y="156" font-size="12" fill="#57606a" text-anchor="start" font-weight="normal" >agree: keep · 1-pt: mean</text>
<text x="426" y="174" font-size="12" fill="#57606a" text-anchor="start" font-weight="normal" >wider split: a person</text>
<line x1="575" y1="150" x2="595" y2="150" stroke="#8c959f" stroke-width="2" marker-end="url(#ah)"/>
<rect x="598" y="100" width="160" height="100" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
<text x="612" y="130" font-size="14" fill="#1b1f24" text-anchor="start" font-weight="600" >Agreement check</text>
<text x="612" y="156" font-size="12" fill="#57606a" text-anchor="start" font-weight="normal" >judges vs. people</text>
<text x="612" y="174" font-size="12" fill="#57606a" text-anchor="start" font-weight="normal" >against a set target</text>
<line x1="761" y1="150" x2="781" y2="150" stroke="#8c959f" stroke-width="2" marker-end="url(#ah)"/>
<rect x="784" y="100" width="160" height="100" rx="8" fill="#ddebff" stroke="#ddebff"/>
<text x="798" y="130" font-size="14" fill="#1b1f24" text-anchor="start" font-weight="600" >Judge scales</text>
<text x="798" y="156" font-size="12" fill="#57606a" text-anchor="start" font-weight="normal" >to new responses,</text>
<text x="798" y="174" font-size="12" fill="#57606a" text-anchor="start" font-weight="normal" >spot-checked by people</text>
<path d="M678.0,202 L678.0,228 L120.0,228 L120.0,204" fill="none" stroke="#8c959f" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#ah)"/>
<text x="399.0" y="244" font-size="12" fill="#57606a" text-anchor="middle" font-weight="normal" >below target: another calibration round</text>
</svg>
