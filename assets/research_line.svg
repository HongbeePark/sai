<svg xmlns="http://www.w3.org/2000/svg" width="960" height="250" viewBox="0 0 960 250" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="960" height="250" rx="10" fill="#ffffff"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8c959f"/></marker></defs>
<text x="40" y="44" font-size="20" fill="#1b1f24" text-anchor="start" font-weight="600" >Research line</text>
<text x="40" y="68" font-size="14" fill="#57606a" text-anchor="start" font-weight="normal" >Each step narrowed the question of whose situation an agent is actually responding to.</text>
<rect x="40" y="92" width="270" height="130" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
<text x="56" y="120" font-size="15" fill="#1b1f24" text-anchor="start" font-weight="600" >Kairos</text>
<text x="56" y="146" font-size="13" fill="#1b1f24" text-anchor="start" font-weight="normal" >Whose expectations do</text>
<text x="56" y="164" font-size="13" fill="#1b1f24" text-anchor="start" font-weight="normal" >models follow?</text>
<text x="56" y="192" font-size="12" fill="#57606a" text-anchor="start" font-weight="normal" >Expectation ranges across</text>
<text x="56" y="209" font-size="12" fill="#57606a" text-anchor="start" font-weight="normal" >languages and social cues</text>
<line x1="314" y1="157" x2="351" y2="157" stroke="#8c959f" stroke-width="2" marker-end="url(#ah)"/>
<rect x="355" y="92" width="270" height="130" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
<text x="371" y="120" font-size="15" fill="#1b1f24" text-anchor="start" font-weight="600" >Recognition vs. uptake</text>
<text x="371" y="146" font-size="13" fill="#1b1f24" text-anchor="start" font-weight="normal" >Do models act on the</text>
<text x="371" y="164" font-size="13" fill="#1b1f24" text-anchor="start" font-weight="normal" >context they notice?</text>
<text x="371" y="192" font-size="12" fill="#57606a" text-anchor="start" font-weight="normal" >Naming missing context</text>
<text x="371" y="209" font-size="12" fill="#57606a" text-anchor="start" font-weight="normal" >≠ changing the advice</text>
<line x1="629" y1="157" x2="666" y2="157" stroke="#8c959f" stroke-width="2" marker-end="url(#ah)"/>
<rect x="670" y="92" width="270" height="130" rx="8" fill="#ddebff" stroke="#ddebff"/>
<text x="686" y="120" font-size="15" fill="#1b1f24" text-anchor="start" font-weight="600" >Sai</text>
<text x="686" y="146" font-size="13" fill="#1b1f24" text-anchor="start" font-weight="normal" >Do agents keep up as</text>
<text x="686" y="164" font-size="13" fill="#1b1f24" text-anchor="start" font-weight="normal" >context arrives?</text>
<text x="686" y="192" font-size="12" fill="#57606a" text-anchor="start" font-weight="normal" >Turn-by-turn gap between</text>
<text x="686" y="209" font-size="12" fill="#57606a" text-anchor="start" font-weight="normal" >given and reflected context</text>
</svg>
